[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-rag"
version = "0.2.0"
description = "Local hybrid retrieval service for agents: parse, chunk, embed, SQLite hybrid search, packed context API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MAHIR BABBAR" }]
keywords = ["rag", "retrieval", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/MAHIR-BABBAR/CRAG"
Repository = "https://github.com/MAHIR-BABBAR/CRAG"
Issues = "https://github.com/MAHIR-BABBAR/CRAG/issues"
Changelog = "https://github.com/MAHIR-BABBAR/CRAG/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ingestion = [
    "charset-normalizer>=3.3",
    "python-frontmatter>=1.1",
    "unstructured-client>=0.26",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pygments>=2.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-pyyaml>=6.0",
    "build>=1.2",
    "twine>=5.0",
]
embeddings = [
    "openai>=1.40",
    "sentence-transformers>=3.0",
]
storage = [
    "numpy>=1.26",
]
# Vectorized exact cosine search. Not an approximate index; see docs/adr/0003.
numpy = [
    "numpy>=1.26",
]
eval = [
    "ir-datasets>=0.5",
]

[project.scripts]
crag = "custom_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that download datasets from the internet (set CRAG_NET_EVAL=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a parameter default is how FastAPI declares dependencies.
"src/custom_rag/api/*.py" = ["B008"]

[tool.mypy]
# 3.12 so mypy can parse modern stub syntax in third-party packages; the code
# itself stays compatible with the 3.11 floor declared in requires-python.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ir_datasets.*",
    "sentence_transformers.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/custom_rag"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
